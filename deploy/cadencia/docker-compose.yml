services:
  mcpserver:
    build:
      context: ../..
      dockerfile: dcArca.McpServer/Dockerfile
    image: dcarca-mcpserver:latest
    container_name: dcarca-mcpserver
    restart: unless-stopped
    networks:
      - red-consultora
      - red-cadencia
    expose:
      - "8080"
    volumes:
      - ${APPSETTINGS_PATH}:/app/appsettings.json:ro
      - ${CERTIFICATE_PATH}:/certs/certificado.pfx:ro
      - /home/ubuntu/apps/dcarca-mcpserver-data:/data
    environment:
      ApiKeys__Directory: /data
      EmissionIdempotency__Directory: /data/emission-idempotency
      FiscalContexts__Directory: /data/fiscal-contexts
      FiscalContext__ConsumerId: ${FISCAL_CONTEXT_CONSUMER_ID:-cadencia}
      FiscalContext__ContextId: ${FISCAL_CONTEXT_ID:-cadencia-arca-homologacion}
      FiscalContext__Environment: ${FISCAL_CONTEXT_ENVIRONMENT:-homologacion}
      FiscalContext__ContextRevision: ${FISCAL_CONTEXT_REVISION:-1}
      FiscalContext__CredentialAssignmentRevision: ${FISCAL_CONTEXT_CREDENTIAL_ASSIGNMENT_REVISION:-legacy-1}
      Pdf__BaseUrl: http://creadorpdf:8080
      Pdf__ApiKey: ${PDF_API_KEY}
    labels:
      - traefik.enable=true
      - traefik.docker.network=red-consultora
      - traefik.http.routers.dcarca-mcpserver.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.dcarca-mcpserver.entrypoints=websecure
      - traefik.http.routers.dcarca-mcpserver.tls=true
      - traefik.http.routers.dcarca-mcpserver.tls.certresolver=${CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.dcarca-mcpserver.loadbalancer.server.port=8080

networks:
  red-consultora:
    external: true
  red-cadencia:
    external: true
