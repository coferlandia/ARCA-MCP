name: Install Coferlandia Skills

on:
  push:
    paths:
      - '.github/workflows/install-coferlandia-skills.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ARCA-MCP
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Coferlandia project skills
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA='b8b6e7119500b0157c264b2834161ac98f6c7942'
          TMP_DIR="$(mktemp -d)"
          git clone --quiet https://github.com/coferlandia/coferlandia-skills.git "$TMP_DIR/coferlandia-skills"
          git -C "$TMP_DIR/coferlandia-skills" checkout --quiet "$SOURCE_SHA"

          mkdir -p .github/skills

          while IFS= read -r skill_dir; do
            [ -f "$skill_dir/SKILL.md" ] || continue
            skill_name="$(basename "$skill_dir")"
            rm -rf ".github/skills/$skill_name"
            cp -a "$skill_dir" ".github/skills/$skill_name"
          done < <(find "$TMP_DIR/coferlandia-skills/skills" -mindepth 2 -maxdepth 2 -type d | sort)

          rm -f .github/workflows/install-coferlandia-skills.yml

      - name: Commit installed skills
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/skills .github/workflows/install-coferlandia-skills.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'chore: install Coferlandia agent skills'
          git push origin HEAD:main
