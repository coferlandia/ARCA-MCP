name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Reject tracked certificate/private-key files
        shell: bash
        run: |
          set -euo pipefail
          sensitive="$(git ls-files | grep -Ei '\.(pfx|p12|p8|key|pem)$' || true)"
          if [ -n "$sensitive" ]; then
            echo "Sensitive key/certificate files must not be tracked:"
            echo "$sensitive"
            exit 1
          fi

      - name: Validate homologation harness
        run: |
          python3 -m py_compile scripts/homologacion/epic14_homologacion.py
          python3 -m unittest scripts/homologacion/test_epic14_homologacion.py

      - name: Validate fiscal smoke harness
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/smoke/fiscal_smoke.sh
          python3 -m py_compile scripts/smoke/fiscal_smoke.py
          python3 -m unittest scripts/smoke/test_fiscal_smoke.py
          bash -n scripts/smoke/test_run_local.sh
          bash scripts/smoke/test_run_local.sh

      - name: Validate API key management
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/api-keys/manage-key.sh
          bash -n scripts/api-keys/test_manage_key.sh
          bash scripts/api-keys/test_manage_key.sh

      - name: Validate PDF template deploy assets
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/cadencia/bootstrap-pdf-template.sh
          bash -n deploy/cadencia/tests/bootstrap-pdf-template-tests.sh
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path("deploy/cadencia/pdf-templates")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest.get("version") == 1
          templates = manifest.get("templates")
          assert isinstance(templates, list) and templates
          seen = set()
          for item in templates:
              logical = (item["key"], item["version"])
              assert logical not in seen, f"duplicate logical template: {logical}"
              seen.add(logical)
              assert (root / item["template"]).is_file(), item["template"]
              assert (root / item["schema"]).is_file(), item["schema"]
          PY
          bash deploy/cadencia/tests/bootstrap-pdf-template-tests.sh

      - name: Restore Core tests
        run: dotnet restore dcArca.Core.Tests/dcArca.Core.Tests.csproj

      - name: Restore MCP tests
        run: dotnet restore dcArca.McpServer.Tests/dcArca.McpServer.Tests.csproj

      - name: Build Core tests
        run: dotnet build dcArca.Core.Tests/dcArca.Core.Tests.csproj --configuration Release --no-restore

      - name: Build MCP tests
        run: dotnet build dcArca.McpServer.Tests/dcArca.McpServer.Tests.csproj --configuration Release --no-restore

      - name: Build CLI
        run: dotnet build dcArca.Cli/dcArca.Cli.csproj --configuration Release

      - name: Validate Docker Compose
        env:
          CERTIFICATE_PATH: /tmp/dummy-certificate.pfx
          PDF_API_KEY: ci-placeholder
          APPSETTINGS_PATH: ./dcArca.McpServer/appsettings.Testing.json
        run: docker compose config -q

      - name: Build MCP container
        run: docker build -t dcarca-mcpserver:ci -f dcArca.McpServer/Dockerfile .

      - name: Validate packaged admin CLI
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e ApiKeys__Directory=/tmp/api-keys \
            --entrypoint dotnet \
            dcarca-mcpserver:ci \
            /tools/dcArca.Cli.dll list-keys | grep -q '^\[\]$'

      - name: Smoke MCP container and restart
        shell: bash
        run: |
          set -euo pipefail
          test_cert="$RUNNER_TEMP/test-cert-placeholder.pfx"
          : > "$test_cert"

          docker run -d --name dcarca-mcp-ci \
            -e ASPNETCORE_ENVIRONMENT=Testing \
            -v "$PWD/dcArca.McpServer/appsettings.Testing.json:/app/appsettings.Testing.json:ro" \
            -v "$test_cert:/app/test-cert-placeholder.pfx:ro" \
            -p 18080:8080 \
            dcarca-mcpserver:ci
          cleanup() {
            docker logs dcarca-mcp-ci || true
            docker rm -f dcarca-mcp-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          wait_ready() {
            for i in {1..30}; do
              if curl --fail --silent http://127.0.0.1:18080/health/live >/dev/null \
                && curl --fail --silent http://127.0.0.1:18080/health/ready >/dev/null; then
                return 0
              fi
              sleep 1
            done
            echo "MCP container did not become ready" >&2
            return 1
          }

          wait_ready
          docker restart dcarca-mcp-ci >/dev/null
          wait_ready

      - name: Audit Core packages
        run: dotnet list dcArca.Core/dcArca.Core.csproj package --vulnerable --include-transitive

      - name: Audit MCP packages
        run: dotnet list dcArca.McpServer/dcArca.McpServer.csproj package --vulnerable --include-transitive

      - name: Audit CLI packages
        run: dotnet list dcArca.Cli/dcArca.Cli.csproj package --vulnerable --include-transitive

      - name: Test Core
        run: dotnet test dcArca.Core.Tests/dcArca.Core.Tests.csproj --configuration Release --no-build

      - name: Test MCP
        run: dotnet test dcArca.McpServer.Tests/dcArca.McpServer.Tests.csproj --configuration Release --no-build
